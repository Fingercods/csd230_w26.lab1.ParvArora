<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Order Confirmation</title>
</head>
<body>

<h1>Order Confirmation</h1>

<p>Order ID: <span th:text="${order.id}"></span></p>
<p>Date: <span th:text="${order.orderDate}"></span></p>
<p>Total: $<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}"></span></p>

<h2>Purchased Items</h2>

<table border="1">
    <tr>
        <th>Type</th>
        <th>Title</th>
        <th>Price</th>
    </tr>

    <tr th:each="product : ${order.products}">
        <td th:text="${product.productType}"></td>
        <td th:text="${product.title}"></td>
        <td th:text="${product.price}"></td>
    </tr>
</table>

<br>

<a th:href="@{/books}">Back to Books</a>

</body>
</html>
